name: PC native builds

on:
  workflow_dispatch:
  push:
    branches: [pc-app]
  pull_request:
    branches: [pc-app]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirement.txt
      - name: Install native Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libxcb-xinerama0
      - run: python -m pip install -r requirement.txt
      - run: python scripts/manage.py test --current-env
      - run: python scripts/manage.py build --current-env
      - uses: actions/upload-artifact@v4
        with:
          name: tCarKit-${{ runner.os }}-${{ runner.arch }}
          path: dist/tCarKit*
          if-no-files-found: error
